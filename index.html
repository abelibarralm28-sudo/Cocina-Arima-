<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cocina Hotel Arima</title>
<style>
:root { --bg:#0a0a0a; --card:#161616; --accent:#00f2ea; --text:#f5f5f5; --border:#2a2a2a; --muted:#888; }
* { box-sizing:border-box; }
body { font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); margin:0; padding:16px; max-width:920px; margin:0 auto; line-height:1.4; }
header { text-align:center; padding:24px 16px; background:#111; border-radius:18px; margin-bottom:20px; }
h1 { margin:0; font-size:1.7em; letter-spacing:-0.3px; }
.subtitle { color:var(--muted); margin:6px 0 0; font-size:0.95em; }
.tabs { display:flex; gap:8px; flex-wrap:wrap; margin:16px 0 20px; }
.tab { padding:8px 16px; background:#222; border-radius:24px; cursor:pointer; font-size:14px; border:1px solid transparent; }
.tab.active { background:var(--accent); color:#000; font-weight:600; }
.card { background:var(--card); border-radius:16px; padding:16px; margin-bottom:14px; border:1px solid var(--border); }
.recipe { background:#1e1e1e; border-radius:12px; padding:14px; margin:8px 0; cursor:pointer; border:1px solid transparent; transition:0.15s; }
.recipe:hover { border-color:#333; }
.recipe h3 { margin:0 0 4px; color:var(--accent); font-size:1.02em; }
.modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:1000; overflow:auto; }
.modal-content { background:#161616; margin:16px auto; padding:20px; border-radius:16px; max-width:680px; }
.close { float:right; font-size:26px; cursor:pointer; color:#aaa; }
.status { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:8px; }
.online { background:#0f0; }
.offline { background:#555; }
.message, .task, .station { background:#1e1e1e; padding:12px; border-radius:10px; margin:8px 0; }
.task.done { opacity:0.55; text-decoration:line-through; }
.alert { background:#2a1f1f; border-left:4px solid #f80; }
.critical { color:#ff6b6b; font-weight:600; margin-top:8px; }
input, textarea { width:100%; background:#222; border:1px solid #333; color:#fff; padding:10px; border-radius:8px; margin:6px 0; }
button { background:var(--accent); color:#000; border:none; padding:8px 14px; border-radius:8px; font-weight:600; cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1>Cocina Hotel Arima</h1>
  <div class="subtitle">Misura · Tilia · Desayunos · Eventos</div>
</header>

<div class="tabs">
  <div class="tab active" onclick="showSection('misura')">Misura</div>
  <div class="tab" onclick="showSection('tilia')">Tilia</div>
  <div class="tab" onclick="showSection('desayunos')">Desayunos</div>
  <div class="tab" onclick="showSection('eventos')">Eventos</div>
  <div class="tab" onclick="showSection('equipo')">Equipo</div>
  <div class="tab" onclick="showSection('mensajes')">Mensajes</div>
  <div class="tab" onclick="showSection('tareas')">Tareas</div>
  <div class="tab" onclick="showSection('avisos')">Avisos</div>
  <div class="tab" onclick="showSection('estaciones')">Estaciones</div>
  <div class="tab" onclick="showSection('pase')">Pase</div>
</div>

<div id="content"></div>

<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const sections = {
  misura: [
    {name: "Jamón ibérico Arturo Sánchez", detail: "Templar 45-60 min a 20-22°C. Lonchas en una sola capa. No apilar.", critical: "Si está frío, la grasa no funde en boca."},
    {name: "Croqueta de bacalao con pil-pil", detail: "Masa 25-28g. Fritura 175°C. Pil-pil de ajo asado a 40-45°C.", critical: "No hervir el pil-pil. Masa blanda se rompe."},
    {name: "Foie mi-cuit con compota de reineta", detail: "Curado 12-18h. Centro 52-54°C. Compota agridulce.", critical: "Por encima de 56°C se funde."},
    {name: "Crema de castañas y tartar de setas", detail: "Crema tibia, cuajada fría, tartar al momento.", critical: "Tartar se sala al final. Níscalos impecables."},
    {name: "Romanesco a la brasa y yema curada", detail: "Marcado a brasa. Salsa verde. Yema curada 3-4 días.", critical: "Secar bien el romanesco. Mojado no marca."},
    {name: "Rodaballo salvaje a la brasa", detail: "Brasa. Escabeche de setas de temporada.", critical: "Producto salvaje o cambiar el plato."},
    {name: "Presa ibérica glaseada", detail: "Glaseado. Cebolleta asada y encurtidos.", critical: "Controlar el glaseado. No quemar."},
    {name: "Chuletón a la brasa con sarmiento", detail: "Brasa + sarmiento al final.", critical: "Sarmiento solo 1-2 min. Llama visible es suciedad."}
  ],
  tilia: [
    {name: "Gilda Yurrita con pan de hierbas", detail: "20 ud. Anchoa 8g, piparra 10g, aceituna 8g.", critical: "Escurrir bien. Pan debe llegar seco."},
    {name: "Croqueta de cecina de León", detail: "50 ud. Masa 40g. Fritura 175°C.", critical: "Interior cremoso. Si se abren, revisar aceite."},
    {name: "Buñuelo de calamar en su tinta", detail: "40 ud. Calamar + tinta. Mayonesa de estragón.", critical: "Calamar tierno. No aumentar huevo por humedad."},
    {name: "Patatas bravas confitadas", detail: "Confitar + fritura. Brava y alioli.", critical: "Patata sin zonas duras. Picante constante."},
    {name: "Rabas crujientes con piquillos", detail: "Calamar rebozado. Emulsión de piquillos.", critical: "Cobertura fina. Control de temperatura."},
    {name: "Trinxat de patata y col", detail: "Patata y col rizada. Acabado crujiente.", critical: "No quedar aguado."},
    {name: "Hamburguesa de vaca con setas y brie", detail: "Vaca + setas + brie.", critical: "70°C / 2 min en centro."},
    {name: "Canelón de setas e Idiazabal", detail: "Relleno de setas. Bechamel de Idiazabal.", critical: "Ligazón correcta. Ni seco ni líquido."},
    {name: "Arroz con leche de oveja", detail: "Leche de oveja + avellana. Crumble aparte.", critical: "Grano tierno. Controlar evaporación."},
    {name: "Tarta de Idiazabal", detail: "Tarta horneada ahumada. Helado de ron y pasas.", critical: "Centro 75°C / 15s."}
  ]
};

let currentSection = 'misura';
let team = JSON.parse(localStorage.getItem('team') || '[{"name":"Abel","status":"online","station":"Pase"},{"name":"Cocinero 1","status":"offline","station":"Frios"}]');
let messages = JSON.parse(localStorage.getItem('messages') || '[]');
let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
let alerts = JSON.parse(localStorage.getItem('alerts') || '[]');
let stations = JSON.parse(localStorage.getItem('stations') || '[{"name":"Frios","status":"ok"},{"name":"Calientes","status":"ok"},{"name":"Pase","status":"ok"},{"name":"Postres","status":"ok"}]');

function showSection(sec) {
  currentSection = sec;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  render();
}

function render() {
  if (currentSection === 'equipo') {
    document.getElementById('content').innerHTML = '<div class="card"><h2>Equipo</h2>' + 
      team.map(p => `<div><span class="status ${p.status}"></span>${p.name} — ${p.status} · ${p.station || ''}</div>`).join('') +
      '<button onclick="toggleMyStatus()">Cambiar mi estado</button></div>';
    return;
  }
  if (currentSection === 'mensajes') {
    document.getElementById('content').innerHTML = '<div class="card"><h2>Mensajes / Incidencias</h2>' +
      '<textarea id="msg" placeholder="Incidencia o mensaje..." rows="3"></textarea>' +
      '<button onclick="sendMessage()">Enviar</button>' +
      messages.map(m => `<div class="message"><strong>${m.user}</strong> (${m.time}): ${m.text}</div>`).join('') +
      '</div>';
    return;
  }
  if (currentSection === 'tareas') {
    document.getElementById('content').innerHTML = '<div class="card"><h2>Tareas diarias</h2>' +
      '<input id="taskInput" placeholder="Nueva tarea...">' +
      '<button onclick="addTask()">Añadir</button>' +
      tasks.map((t,i) => `<div class="task ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${i})"> ${t.text}</div>`).join('') +
      '</div>';
    return;
  }
  if (currentSection === 'avisos') {
    document.getElementById('content').innerHTML = '<div class="card"><h2>Avisos</h2>' +
      '<textarea id="alertInput" placeholder="Aviso importante..." rows="2"></textarea>' +
      '<button onclick="addAlert()">Publicar aviso</button>' +
      alerts.map(a => `<div class="message alert"><strong>AVISO</strong> (${a.time}): ${a.text}</div>`).join('') +
      '</div>';
    return;
  }
  if (currentSection === 'estaciones') {
    document.getElementById('content').innerHTML = '<div class="card"><h2>Estaciones</h2>' +
      stations.map(s => `<div class="station"><strong>${s.name}</strong> — ${s.status}</div>`).join('') +
      '<p style="font-size:13px;color:var(--muted)">Control de estaciones para el pase.</p></div>';
    return;
  }
  if (currentSection === 'pase') {
    document.getElementById('content').innerHTML = '<div class="card"><h2>Pase</h2>' +
      '<p>Orden de salida y control de platos.</p>' +
      '<div class="station">1. Entrantes</div><div class="station">2. Principales</div><div class="station">3. Postres</div>' +
      '<p style="font-size:13px;color:var(--muted)">Sección de control de pase.</p></div>';
    return;
  }
  const list = sections[currentSection] || [];
  document.getElementById('content').innerHTML = '<div class="card"><h2>' + currentSection.toUpperCase() + '</h2>' +
    list.map(r => `<div class="recipe" onclick="openRecipe('${r.name}')"><h3>${r.name}</h3></div>`).join('') +
    '</div>';
}

function openRecipe(name) {
  let detail = "Ficha en desarrollo.";
  let critical = "";
  for (let sec in sections) {
    const found = sections[sec].find(r => r.name === name);
    if (found) {
      detail = found.detail;
      critical = found.critical || "";
    }
  }
  document.getElementById('modal-body').innerHTML = `<h2>${name}</h2><p>${detail}</p>${critical ? `<p class="critical">Punto crítico: ${critical}</p>` : ''}`;
  document.getElementById('modal').style.display = 'block';
}

function closeModal() { document.getElementById('modal').style.display = 'none'; }

function toggleMyStatus() {
  team[0].status = team[0].status === 'online' ? 'offline' : 'online';
  localStorage.setItem('team', JSON.stringify(team));
  render();
}

function sendMessage() {
  const text = document.getElementById('msg').value.trim();
  if (!text) return;
  messages.unshift({user: 'Abel', time: new Date().toLocaleTimeString(), text});
  localStorage.setItem('messages', JSON.stringify(messages));
  render();
}

function addTask() {
  const text = document.getElementById('taskInput').value.trim();
  if (!text) return;
  tasks.unshift({text, done: false});
  localStorage.setItem('tasks', JSON.stringify(tasks));
  render();
}

function toggleTask(i) {
  tasks[i].done = !tasks[i].done;
  localStorage.setItem('tasks', JSON.stringify(tasks));
  render();
}

function addAlert() {
  const text = document.getElementById('alertInput').value.trim();
  if (!text) return;
  alerts.unshift({text, time: new Date().toLocaleTimeString()});
  localStorage.setItem('alerts', JSON.stringify(alerts));
  render();
}

render();
window.onclick = e => { if (e.target.id === 'modal') closeModal(); };
</script>
</body>
</html>
