<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cocina Hotel Arima</title>
<style>
:root { --bg:#0f0f0f; --card:#1a1a1a; --accent:#00f2ea; --text:#fff; --border:#333; }
body { font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); margin:0; padding:12px; max-width:900px; margin:0 auto; }
header { text-align:center; padding:20px; background:#111; border-radius:16px; margin-bottom:16px; }
h1 { margin:0; font-size:1.6em; }
.tabs { display:flex; gap:6px; flex-wrap:wrap; margin:12px 0; }
.tab { padding:8px 14px; background:#222; border-radius:20px; cursor:pointer; font-size:14px; }
.tab.active { background:var(--accent); color:#000; font-weight:bold; }
.card { background:var(--card); border-radius:14px; padding:14px; margin-bottom:12px; border:1px solid var(--border); }
.recipe { background:#222; border-radius:10px; padding:12px; margin:8px 0; cursor:pointer; }
.recipe h3 { margin:0 0 4px; color:var(--accent); font-size:1em; }
.modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:1000; overflow:auto; }
.modal-content { background:#1a1a1a; margin:10px auto; padding:16px; border-radius:14px; max-width:700px; }
.close { float:right; font-size:24px; cursor:pointer; }
.status { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; }
.online { background:#0f0; }
.offline { background:#666; }
.message, .task, .station { background:#222; padding:10px; border-radius:8px; margin:6px 0; }
.task.done { opacity:0.6; text-decoration:line-through; }
.alert { background:#331; border-left:4px solid #f80; }
.critical { color:#f55; font-weight:bold; }
</style>
</head>
<body>
<header>
  <h1>Cocina Hotel Arima</h1>
  <p>Misura · Tilia · Desayunos · Eventos</p>
</header>

<div class="tabs">
  <div class="tab active" onclick="showSection('misura')">Misura</div>
  <div class="tab" onclick="showSection('tilia')">Tilia</div>
  <div class="tab" onclick="showSection('desayunos')">Desayunos</div>
  <div class="tab" onclick="showSection('eventos')">Eventos</div>
  <div class="tab" onclick="showSection('equipo')">Equipo</div>
  <div class="tab" onclick="showSection('mensajes')">Mensajes</div>
  <div class="tab" onclick="showSection('tareas')">Tareas</div>
  <div class="tab" onclick="showSection('avisos')">Avisos</div>
  <div class="tab" onclick="showSection('estaciones')">Estaciones</div>
  <div class="tab" onclick="showSection('pase')">Pase</div>
</div>

<div id="content"></div>

<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const sections = {
  misura: [
    {name: "Jamón ibérico Arturo Sánchez", detail: "Templar 45-60 min a 20-22°C. Lonchas en una sola capa. No apilar. Punto crítico: temperatura de servicio.", critical: "Si está frío, la grasa no funde."},
    {name: "Croqueta de bacalao con pil-pil", detail: "Masa 25-28g. Fritura 175°C. Pil-pil de ajo asado a 40-45°C. Punto crítico: no hervir el pil-pil.", critical: "Masa demasiado blanda se rompe al freír."},
    {name: "Foie mi-cuit con compota de reineta", detail: "Curado 12-18h. Centro 52-54°C. Compota agridulce. Punto crítico: no superar 56°C.", critical: "Por encima de 56°C se funde."},
    {name: "Crema de castañas y tartar de setas", detail: "Crema tibia, cuajada fría, tartar al momento. Punto crítico: tartar se sala al final.", critical: "Níscalos crudos deben estar impecables."},
    {name: "Romanesco a la brasa y yema curada", detail: "Marcado a brasa. Salsa verde. Yema curada 3-4 días. Punto crítico: secar bien el romanesco.", critical: "Mojado no marca."},
    {name: "Rodaballo salvaje a la brasa", detail: "Brasa. Escabeche de setas. Punto crítico: producto salvaje o cambiar el plato.", critical: "No usar de piscifactoría."},
    {name: "Presa ibérica glaseada", detail: "Glaseado. Cebolleta asada y encurtidos. Punto crítico: control de glaseado.", critical: "No quemar el glaseado."},
    {name: "Chuletón a la brasa con sarmiento", detail: "Brasa + sarmiento al final. Punto crítico: sarmiento solo 1-2 min.", critical: "Llama visible es suciedad."}
  ],
  tilia: [
    {name: "Gilda Yurrita con pan de hierbas", detail: "20 ud. Anchoa 8g, piparra 10g, aceituna 8g. Punto crítico: escurrir bien.", critical: "Pan debe llegar seco."},
    {name: "Croqueta de cecina de León", detail: "50 ud. Masa 40g. Fritura 175°C. Punto crítico: interior cremoso.", critical: "Si se abren, revisar aceite y tanda."},
    {name: "Buñuelo de calamar en su tinta", detail: "40 ud. Calamar + tinta. Mayonesa de estragón. Punto crítico: calamar tierno.", critical: "No aumentar huevo para corregir humedad."},
    {name: "Patatas bravas confitadas", detail: "Confitar + fritura. Brava y alioli. Punto crítico: patata sin zonas duras.", critical: "Picante constante, no a ojo."},
    {name: "Rabas crujientes con piquillos", detail: "Calamar rebozado. Emulsión de piquillos. Punto crítico: cobertura fina.", critical: "Control de temperatura de fritura."},
    {name: "Trinxat de patata y col", detail: "Patata y col rizada. Acabado crujiente. Punto crítico: textura.", critical: "No quedar aguado."},
    {name: "Hamburguesa de vaca con setas y brie", detail: "Vaca + setas + brie. Punto crítico: cocción completa.", critical: "70°C / 2 min en centro."},
    {name: "Canelón de setas e Idiazabal", detail: "Relleno de setas. Bechamel de Idiazabal. Punto crítico: ligazón.", critical: "No quedar seco ni líquido."},
    {name: "Arroz con leche de oveja", detail: "Leche de oveja + avellana. Crumble aparte. Punto crítico: grano tierno.", critical: "Controlar evaporación."},
    {name: "Tarta de Idiazabal", detail: "Tarta horneada ahumada. Helado de ron y pasas. Punto crítico: cuajado.", critical: "Centro 75°C / 15s."}
  ]
};

let currentSection = 'misura';
let team = JSON.parse(localStorage.getItem('team') || '[{"name":"Abel","status":"online","station":"Pase"},{"name":"Cocinero 1","status":"offline","station":"Frios"}]');
let messages = JSON.parse(localStorage.getItem('messages') || '[]');
let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
let alerts = JSON.parse(localStorage.getItem('alerts') || '[]');
let stations = JSON.parse(localStorage.getItem('stations') || '[{"name":"Frios","status":"ok"},{"name":"Calientes","status":"ok"},{"name":"Pase","status":"ok"},{"name":"Postres","status":"ok"}]');

function showSection(sec) {
  currentSection = sec;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  render();
}

function render() {
  if (currentSection === 'equipo') {
    document.getElementById('content').innerHTML = '<div class="card"><h2>Equipo</h2>' + 
      team.map(p => `<div><span class="status ${p.status}"></span>${p.name} — ${p.status} · ${p.station || ''}</div>`).join('') +
      '<button onclick="toggleMyStatus()">Cambiar mi estado</button></div>';
    return;
  }
  if (currentSection === 'mensajes') {
    document.getElementById('content').innerHTML = '<div class="card"><h2>Mensajes / Incidencias</h2>' +
      '<textarea id="msg" placeholder="Incidencia o mensaje..." rows="3"></textarea>' +
      '<button onclick="sendMessage()">Enviar</button>' +
      messages.map(m => `<div class="message"><strong>${m.user}</strong> (${m.time}): ${m.text}</div>`).join('') +
      '</div>';
    return;
  }
  if (currentSection === 'tareas') {
    document.getElementById('content').innerHTML = '<div class="card"><h2>Tareas diarias</h2>' +
      '<input id="taskInput" placeholder="Nueva tarea...">' +
      '<button onclick="addTask()">Añadir</button>' +
      tasks.map((t,i) => `<div class="task ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${i})"> ${t.text}</div>`).join('') +
      '</div>';
    return;
  }
  if (currentSection === 'avisos') {
    document.getElementById('content').innerHTML = '<div class="card"><h2>Avisos</h2>' +
      '<textarea id="alertInput" placeholder="Aviso importante..." rows="2"></textarea>' +
      '<button onclick="addAlert()">Publicar aviso</button>' +
      alerts.map(a => `<div class="message alert"><strong>AVISO</strong> (${a.time}): ${a.text}</div>`).join('') +
      '</div>';
    return;
  }
  if (currentSection === 'estaciones') {
    document.getElementById('content').innerHTML = '<div class="card"><h2>Estaciones</h2>' +
      stations.map(s => `<div class="station"><strong>${s.name}</strong> — ${s.status}</div>`).join('') +
      '<p style="font-size:13px;color:#aaa">Control de estaciones para el pase.</p></div>';
    return;
  }
  if (currentSection === 'pase') {
    document.getElementById('content').innerHTML = '<div class="card"><h2>Pase</h2>' +
      '<p>Orden de salida y control de platos.</p>' +
      '<div class="station">1. Entrantes</div><div class="station">2. Principales</div><div class="station">3. Postres</div>' +
      '<p style="font-size:13px;color:#aaa">Sección de control de pase. Se puede ampliar con tickets y tiempos.</p></div>';
    return;
  }
  const list = sections[currentSection] || [];
  document.getElementById('content').innerHTML = '<div class="card"><h2>' + currentSection.toUpperCase() + '</h2>' +
    list.map(r => `<div class="recipe" onclick="openRecipe('${r.name}')"><h3>${r.name}</h3></div>`).join('') +
    '</div>';
}

function openRecipe(name) {
  let detail = "Ficha en desarrollo.";
  let critical = "";
  for (let sec in sections) {
    const found = sections[sec].find(r => r.name === name);
    if (found) {
      detail = found.detail;
      critical = found.critical || "";
    }
  }
  document.getElementById('modal-body').innerHTML = `<h2>${name}</h2><p>${detail}</p>${critical ? `<p class="critical">Punto crítico: ${critical}</p>` : ''}<p><em>Ficha técnica resumida.</em></p>`;
  document.getElementById('modal').style.display = 'block';
}

function closeModal() { document.getElementById('modal').style.display = 'none'; }

function toggleMyStatus() {
  team[0].status = team[0].status === 'online' ? 'offline' : 'online';
  localStorage.setItem('team', JSON.stringify(team));
  render();
}

function sendMessage() {
  const text = document.getElementById('msg').value.trim();
  if (!text) return;
  messages.unshift({user: 'Abel', time: new Date().toLocaleTimeString(), text});
  localStorage.setItem('messages', JSON.stringify(messages));
  render();
}

function addTask() {
  const text = document.getElementById('taskInput').value.trim();
  if (!text) return;
  tasks.unshift({text, done: false});
  localStorage.setItem('tasks', JSON.stringify(tasks));
  render();
}

function toggleTask(i) {
  tasks[i].done = !tasks[i].done;
  localStorage.setItem('tasks', JSON.stringify(tasks));
  render();
}

function addAlert() {
  const text = document.getElementById('alertInput').value.trim();
  if (!text) return;
  alerts.unshift({text, time: new Date().toLocaleTimeString()});
  localStorage.setItem('alerts', JSON.stringify(alerts));
  render();
}

render();
window.onclick = e => { if (e.target.id === 'modal') closeModal(); };
</script>
</body>
</html>
