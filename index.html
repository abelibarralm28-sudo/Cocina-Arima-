<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cocina Hotel Arima</title>
<style>
body { font-family: system-ui, sans-serif; background:#0a0a0a; color:#f5f5f5; margin:0; padding:16px; max-width:850px; margin:0 auto; line-height:1.4; }
header { text-align:center; padding:20px; background:#111; border-radius:16px; }
h1 { margin:0; }
.tabs { display:flex; gap:6px; flex-wrap:wrap; margin:16px 0; }
.tab { padding:8px 14px; background:#222; border-radius:20px; cursor:pointer; font-size:14px; }
.tab.active { background:#00f2ea; color:#000; font-weight:bold; }
.card { background:#161616; border-radius:14px; padding:16px; margin:12px 0; border:1px solid #2a2a2a; }
.recipe { background:#1e1e1e; border-radius:10px; padding:12px; margin:8px 0; cursor:pointer; }
.recipe h3 { margin:0; color:#00f2ea; }
.modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:1000; overflow:auto; }
.modal-content { background:#161616; margin:16px auto; padding:20px; border-radius:14px; max-width:680px; }
.close { float:right; font-size:24px; cursor:pointer; }
input, textarea, button { background:#222; color:#fff; border:1px solid #333; padding:8px; border-radius:8px; width:100%; margin:4px 0; }
button { width:auto; background:#00f2ea; color:#000; font-weight:bold; cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1>Cocina Hotel Arima</h1>
  <p>Misura · Tilia · Desayunos · Eventos</p>
</header>

<div class="tabs" id="tabs"></div>
<div id="content"></div>

<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const sections = {
  misura: [
    {name: "Jamón ibérico Arturo Sánchez", detail: "Templar 45-60 min a 20-22°C. Lonchear fino en una sola capa. No apilar.", critical: "Si está frío, la grasa no funde."},
    {name: "Croqueta cremosa de bacalao con pil-pil", detail: "Masa 25-28g. Fritura 175°C. Pil-pil de ajo asado a 40-45°C.", critical: "No hervir el pil-pil."},
    {name: "Rodaballo salvaje a la brasa con escabeche de setas", detail: "Marcar a la brasa. Escabeche de setas. Terminar con aceite de ajo.", critical: "No sobrecocinar el producto salvaje."},
    {name: "Presa ibérica glaseada", detail: "Sellar y glasear. Acompañar con cebolleta asada.", critical: "Controlar el glaseado."},
    {name: "Chuletón a la brasa con sarmiento", detail: "Brasa. Sarmiento solo al final (1-2 min). Reposar 3-4 min.", critical: "Llama visible es suciedad."}
  ],
  tilia: [
    {name: "Gilda Yurrita con pan de hierbas", detail: "Montar anchoa, piparra y aceituna. Servir con pan de hierbas.", critical: "Escurrir bien."},
    {name: "Croqueta cremosa de cecina de León", detail: "Fritura 175°C. Interior cremoso.", critical: "Si se abren, revisar aceite."},
    {name: "Hamburguesa de vaca con setas y brie", detail: "Cocción completa (70°C / 2 min). Fundir el brie.", critical: "Temperatura interna obligatoria."}
  ],
  desayunos: [
    {name: "Tarta tres leches con leche de coco", detail: "Bizcocho + baño de tres leches de coco. Reposo mínimo 4h.", critical: "Leches frías."},
    {name: "Tarta de chocolate clásica", detail: "Base de galleta + ganache + 3 huevos. Horno 170°C.", critical: "Centro ligeramente tembloroso."}
  ],
  eventos: [
    {name: "Higos con mascarpone y helado de pistacho", detail: "Quenelle de helado + crema de mascarpone + higos + pistacho.", critical: "Montaje rápido. Plato congelado."},
    {name: "Salsa mole oscuro", detail: "Mole de chiles, frutos secos y chocolate. Reposo 12-24h.", critical: "Tostar chiles sin quemar."}
  ]
};

let messages = JSON.parse(localStorage.getItem("messages") || "[]");
let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");
let notices = JSON.parse(localStorage.getItem("notices") || "[]");

const tabNames = ["misura","tilia","desayunos","eventos","equipo","mensajes","tareas","avisos","estaciones","pase"];
let current = "misura";

function init() {
  const tabs = document.getElementById("tabs");
  tabNames.forEach(name => {
    const d = document.createElement("div");
    d.className = "tab" + (name === current ? " active" : "");
    d.textContent = name.charAt(0).toUpperCase() + name.slice(1);
    d.onclick = () => show(name);
    tabs.appendChild(d);
  });
  render();
}

function show(name) {
  current = name;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  event.target.classList.add("active");
  render();
}

function render() {
  if (current === "mensajes") return renderMessages();
  if (current === "tareas") return renderTasks();
  if (current === "avisos") return renderNotices();
  if (["equipo","estaciones","pase"].includes(current)) {
    document.getElementById("content").innerHTML = `<div class="card"><h2>${current.toUpperCase()}</h2><p>Sección activa. Próximamente más funciones.</p></div>`;
    return;
  }
  const list = sections[current] || [];
  document.getElementById("content").innerHTML = `<div class="card"><h2>${current.toUpperCase()}</h2>` +
    list.map(r => `<div class="recipe" onclick="openRecipe('${r.name}')"><h3>${r.name}</h3></div>`).join("") +
    `</div>`;
}

function renderMessages() {
  document.getElementById("content").innerHTML = `
    <div class="card">
      <h2>MENSAJES</h2>
      <input id="msg" placeholder="Escribe un mensaje...">
      <button onclick="addMessage()">Enviar</button>
      <div id="msg-list">${messages.map(m => `<p>${m}</p>`).join("")}</div>
    </div>`;
}

function addMessage() {
  const text = document.getElementById("msg").value.trim();
  if (!text) return;
  messages.push(text);
  localStorage.setItem("messages", JSON.stringify(messages));
  renderMessages();
}

function renderTasks() {
  document.getElementById("content").innerHTML = `
    <div class="card">
      <h2>TAREAS</h2>
      <input id="task" placeholder="Nueva tarea...">
      <button onclick="addTask()">Añadir</button>
      <div>${tasks.map((t,i) => `<p>${t} <button onclick="removeTask(${i})">Hecho</button></p>`).join("")}</div>
    </div>`;
}

function addTask() {
  const text = document.getElementById("task").value.trim();
  if (!text) return;
  tasks.push(text);
  localStorage.setItem("tasks", JSON.stringify(tasks));
  renderTasks();
}

function removeTask(i) {
  tasks.splice(i,1);
  localStorage.setItem("tasks", JSON.stringify(tasks));
  renderTasks();
}

function renderNotices() {
  document.getElementById("content").innerHTML = `
    <div class="card">
      <h2>AVISOS</h2>
      <input id="notice" placeholder="Nuevo aviso...">
      <button onclick="addNotice()">Publicar</button>
      <div>${notices.map(n => `<p>${n}</p>`).join("")}</div>
    </div>`;
}

function addNotice() {
  const text = document.getElementById("notice").value.trim();
  if (!text) return;
  notices.push(text);
  localStorage.setItem("notices", JSON.stringify(notices));
  renderNotices();
}

function openRecipe(name) {
  let r = null;
  for (let s in sections) {
    const f = sections[s].find(x => x.name === name);
    if (f) r = f;
  }
  if (!r) return;
  document.getElementById("modal-body").innerHTML = `<h2>${r.name}</h2><p>${r.detail}</p><p style="color:#ff6b6b;"><strong>Punto crítico:</strong> ${r.critical}</p>`;
  document.getElementById("modal").style.display = "block";
}

function closeModal() { document.getElementById("modal").style.display = "none"; }

init();
window.onclick = e => { if (e.target.id === "modal") closeModal(); };
</script>
</body>
</html>
