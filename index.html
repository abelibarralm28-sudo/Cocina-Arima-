<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cocina Hotel Arima</title>
<style>
:root { --bg:#0a0a0a; --card:#161616; --accent:#00f2ea; --text:#f5f5f5; --border:#2a2a2a; --muted:#888; }
* { box-sizing:border-box; }
body { font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); margin:0; padding:16px; max-width:920px; margin:0 auto; line-height:1.4; }
header { text-align:center; padding:24px 16px; background:#111; border-radius:18px; margin-bottom:20px; }
h1 { margin:0; font-size:1.7em; }
.subtitle { color:var(--muted); margin:6px 0 0; font-size:0.95em; }
.tabs { display:flex; gap:8px; flex-wrap:wrap; margin:16px 0 20px; }
.tab { padding:8px 16px; background:#222; border-radius:24px; cursor:pointer; font-size:14px; }
.tab.active { background:var(--accent); color:#000; font-weight:600; }
.card { background:var(--card); border-radius:16px; padding:16px; margin-bottom:14px; border:1px solid var(--border); }
.recipe { background:#1e1e1e; border-radius:12px; padding:14px; margin:8px 0; cursor:pointer; }
.recipe h3 { margin:0 0 4px; color:var(--accent); font-size:1.02em; }
.modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:1000; overflow:auto; }
.modal-content { background:#161616; margin:16px auto; padding:20px; border-radius:16px; max-width:680px; }
.close { float:right; font-size:26px; cursor:pointer; color:#aaa; }
.critical { color:#ff6b6b; font-weight:600; margin-top:8px; }
.allergens { color:#ffa500; font-size:0.9em; margin-top:6px; }
.cost { color:#4ade80; font-weight:600; }
button, input[type=number] { background:#222; color:#fff; border:1px solid #333; padding:8px 12px; border-radius:8px; }
button.primary { background:var(--accent); color:#000; border:none; font-weight:600; }
</style>
</head>
<body>
<header>
  <h1>Cocina Hotel Arima</h1>
  <div class="subtitle">Misura · Tilia · Desayunos · Eventos</div>
</header>

<div class="tabs">
  <div class="tab active" onclick="showSection('misura')">Misura</div>
  <div class="tab" onclick="showSection('tilia')">Tilia</div>
  <div class="tab" onclick="showSection('desayunos')">Desayunos</div>
  <div class="tab" onclick="showSection('eventos')">Eventos</div>
  <div class="tab" onclick="showSection('equipo')">Equipo</div>
  <div class="tab" onclick="showSection('mensajes')">Mensajes</div>
  <div class="tab" onclick="showSection('tareas')">Tareas</div>
  <div class="tab" onclick="showSection('avisos')">Avisos</div>
  <div class="tab" onclick="showSection('estaciones')">Estaciones</div>
  <div class="tab" onclick="showSection('pase')">Pase</div>
</div>

<div id="content"></div>

<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const sections = {
  misura: [
    {name: "Jamón ibérico Arturo Sánchez", gramaje: "60-80g", allergens: "Ninguno", cost: 4.8, detail: "Templar 45-60 min a 20-22°C.", critical: "Si está frío, la grasa no funde."},
    {name: "Croqueta cremosa de bacalao con pil-pil", gramaje: "25-28g x3", allergens: "Gluten, Lactosa, Pescado, Huevo", cost: 1.9, detail: "Fritura 175°C. Pil-pil de ajo asado.", critical: "No hervir el pil-pil."},
    {name: "Foie mi-cuit, compota de manzana reineta", gramaje: "45-50g", allergens: "Lactosa", cost: 6.2, detail: "Centro 52-54°C.", critical: "Por encima de 56°C se funde."},
    {name: "Rodaballo salvaje a la brasa con escabeche de setas", gramaje: "140-160g", allergens: "Pescado", cost: 8.5, detail: "Brasa. Escabeche de setas.", critical: "Producto salvaje."},
    {name: "Presa ibérica glaseada", gramaje: "140-160g", allergens: "Ninguno", cost: 5.4, detail: "Glaseado. Cebolleta asada.", critical: "Controlar el glaseado."},
    {name: "Chuletón a la brasa con sarmiento", gramaje: "350-400g", allergens: "Ninguno", cost: 18.0, detail: "Brasa + sarmiento al final.", critical: "Sarmiento 1-2 min."}
  ],
  tilia: [
    {name: "Gilda Yurrita con pan de hierbas", gramaje: "20 ud", allergens: "Pescado, Gluten", cost: 0.85, detail: "Anchoa, piparra, aceituna.", critical: "Escurrir bien."},
    {name: "Croqueta cremosa de cecina de León", gramaje: "40g x50", allergens: "Gluten, Lactosa, Huevo", cost: 0.65, detail: "Fritura 175°C.", critical: "Interior cremoso."},
    {name: "Hamburguesa de vaca con setas y brie", gramaje: "160g", allergens: "Gluten, Lactosa", cost: 3.8, detail: "Vaca + setas + brie.", critical: "70°C / 2 min."},
    {name: "Tarta de Idiazabal con helado de ron y pasas", gramaje: "1 porción", allergens: "Lactosa, Huevo", cost: 2.1, detail: "Tarta ahumada.", critical: "Cuajado correcto."}
  ]
};

let currentSection = 'misura';

function showSection(sec) {
  currentSection = sec;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  render();
}

function render() {
  const list = sections[currentSection] || [];
  document.getElementById('content').innerHTML = '<div class="card"><h2>' + currentSection.toUpperCase() + '</h2>' +
    list.map(r => `<div class="recipe" onclick="openRecipe('${r.name}')"><h3>${r.name}</h3><div class="cost">~${r.cost}€</div></div>`).join('') +
    '</div>';
}

function openRecipe(name) {
  let r = null;
  for (let sec in sections) {
    const found = sections[sec].find(x => x.name === name);
    if (found) r = found;
  }
  if (!r) return;
  document.getElementById('modal-body').innerHTML = `
    <h2>${r.name}</h2>
    <p><strong>Gramaje base:</strong> ${r.gramaje}</p>
    <p class="allergens"><strong>Alérgenos:</strong> ${r.allergens}</p>
    <p class="cost"><strong>Coste orientativo:</strong> ${r.cost}€ por ración</p>
    <p>${r.detail}</p>
    ${r.critical ? `<p class="critical">Punto crítico: ${r.critical}</p>` : ''}
    <div style="margin-top:16px;">
      <label>Comensales: <input type="number" id="covers" value="4" min="1" style="width:60px"></label>
      <button class="primary" onclick="scale('${r.name}')">Escalar</button>
      <div id="scaled" style="margin-top:10px; color:#aaa;"></div>
    </div>
  `;
  document.getElementById('modal').style.display = 'block';
}

function scale(name) {
  const covers = parseInt(document.getElementById('covers').value) || 1;
  document.getElementById('scaled').innerHTML = `Gramaje escalado para <strong>${covers}</strong> comensales.<br><small>Multiplica el gramaje base por ${covers}.</small>`;
}

function closeModal() { document.getElementById('modal').style.display = 'none'; }

render();
window.onclick = e => { if (e.target.id === 'modal') closeModal(); };
</script>
</body>
</html>
