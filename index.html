<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cocina Hotel Arima</title>
<style>
:root { --bg:#0a0a0a; --card:#161616; --accent:#00f2ea; --text:#f5f5f5; --border:#2a2a2a; }
* { box-sizing:border-box; }
body { font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); margin:0; padding:16px; max-width:900px; margin:0 auto; }
header { text-align:center; padding:20px; background:#111; border-radius:16px; margin-bottom:16px; }
h1 { margin:0; }
.tabs { display:flex; gap:6px; flex-wrap:wrap; margin:12px 0; }
.tab { padding:8px 14px; background:#222; border-radius:20px; cursor:pointer; font-size:14px; }
.tab.active { background:var(--accent); color:#000; font-weight:bold; }
.card { background:var(--card); border-radius:14px; padding:14px; margin-bottom:12px; border:1px solid var(--border); }
.recipe { background:#1e1e1e; border-radius:10px; padding:12px; margin:8px 0; cursor:pointer; }
.recipe h3 { margin:0; color:var(--accent); font-size:1em; }
.modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:1000; overflow:auto; }
.modal-content { background:#161616; margin:16px auto; padding:20px; border-radius:14px; max-width:650px; }
.close { float:right; font-size:24px; cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1>Cocina Hotel Arima</h1>
  <p>Misura · Tilia · Desayunos · Eventos</p>
</header>

<div class="tabs" id="tabs"></div>
<div id="content"></div>

<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const sections = {
  misura: [
    {name: "Jamón ibérico Arturo Sánchez", detail: "Templar 45-60 min a 20-22°C. Lonchas en una sola capa."},
    {name: "Croqueta cremosa de bacalao con pil-pil", detail: "Masa 25-28g. Fritura 175°C. Pil-pil de ajo asado."},
    {name: "Foie mi-cuit, compota de manzana reineta", detail: "Curado 12-18h. Centro 52-54°C."},
    {name: "Crema de castañas, cuajada de oveja y tartar de setas", detail: "Crema tibia, cuajada fría, tartar al momento."},
    {name: "Romanesco a la brasa en salsa verde y yema curada", detail: "Marcado a brasa. Salsa verde. Yema curada."},
    {name: "Alcachofas estofadas con relleno de ibérico", detail: "Alcachofas + relleno de ibérico."},
    {name: "Arroz caldoso de níscalos y trufa", detail: "Arroz Molí de Rafalet. Níscalos y trufa."},
    {name: "Sopa de pescado a la donostiarra", detail: "Sopa clásica donostiarra."},
    {name: "Rape con su refrito de ajos y txakoli", detail: "Rape + refrito de ajos + txakoli."},
    {name: "Pulpo a la brasa, calabaza y mayonesa de aceitunas", detail: "Pulpo a la brasa. Calabaza asada."},
    {name: "Canelón de txangurro", detail: "Relleno de txangurro. Bechamel de mariscos."},
    {name: "Rodaballo salvaje a la brasa con escabeche de setas", detail: "Rodaballo salvaje. Escabeche de setas."},
    {name: "Steak tartar de vaca con tuétano", detail: "Tartar + tuétano a la brasa."},
    {name: "Presa ibérica glaseada", detail: "Presa Arturo Sánchez. Cebolleta asada."},
    {name: "Cordero lechal a la brasa con Idiazábal", detail: "Cordero lechal. Salsa de Idiazábal."},
    {name: "Pichón de Bresse con mole y salsifí", detail: "Pichón. Salsa mole. Crema de salsifí."},
    {name: "Chuletón a la brasa con sarmiento", detail: "Chuletón madurado. Sarmiento al final."},
    {name: "Patata frita con sal de hierbas", detail: "Doble fritura. Sal de hierbas y limón."},
    {name: "Pimiento de piquillo y su pil-pil", detail: "Piquillos asados. Pil-pil de su jugo."},
    {name: "Endivias escabechadas con mandarina", detail: "Endivias + escabeche cítrico."},
    {name: "Pan de coca de Fuengirola con tomate", detail: "Coca + tomate Roseta + AOVE."},
    {name: "Cítricos de invierno en texturas", detail: "Cítricos + helado de leche de oveja."},
    {name: "Pastel fluido de chocolate, café y sal ahumada", detail: "Coulant. Centro líquido."},
    {name: "Manzana confitada con intxaursaltsa", detail: "Manzana + intxaursaltsa + helado de sidra."},
    {name: "Tarta de queso ahumada", detail: "Tarta horneada ahumada. Helado de ron y pasas."}
  ],
  tilia: [
    {name: "Gilda Yurrita con pan de hierbas", detail: "20 ud. Anchoa, piparra, aceituna."},
    {name: "Croqueta cremosa de cecina de León", detail: "50 ud. Masa 40g."},
    {name: "Buñuelo de calamar en su tinta", detail: "40 ud. Calamar + tinta."},
    {name: "Patatas bravas confitadas", detail: "Confitar + fritura. Brava y alioli."},
    {name: "Rabas crujientes con piquillos", detail: "Calamar rebozado. Emulsión de piquillos."},
    {name: "Trinxat de patata y col rizada", detail: "Patata + col. Acabado crujiente."},
    {name: "Huevo roto con boniato y jamón", detail: "Huevo + boniato + jamón."},
    {name: "Crema de calabaza con setas y naranja", detail: "Crema + setas + naranja."},
    {name: "Hamburguesa de vaca con setas y brie", detail: "Vaca + setas + brie."},
    {name: "Pescado del día con parmentier y salsa verde", detail: "Pescado + parmentier + salsa verde."},
    {name: "Canelón de setas e Idiazabal", detail: "Setas + Idiazabal."},
    {name: "Costilla de lechal con reducción de sidra", detail: "Costilla + reducción de sidra."},
    {name: "Tubetti rigati con albóndigas de ternera", detail: "Pasta + albóndigas."},
    {name: "Arroz con leche de oveja y avellana", detail: "Arroz + leche de oveja + crumble."},
    {name: "Tarta de Idiazabal con helado de ron y pasas", detail: "Tarta ahumada + helado."},
    {name: "Pera al vino con mascarpone y lima", detail: "Pera + mascarpone + lima."},
    {name: "Torrija de pan hojaldrado con toffee", detail: "Torrija + toffee + helado."}
  ],
  desayunos: [
    {name: "Desayuno continental", detail: "Pan, bollería, fruta, zumo y café."},
    {name: "Tortilla de patata", detail: "Tortilla clásica."},
    {name: "Huevos rotos", detail: "Huevos + jamón o chorizo."}
  ],
  eventos: [
    {name: "Menú grupo 1", detail: "Entrante + principal + postre."},
    {name: "Menú grupo 2", detail: "Opción vegetariana disponible."}
  ]
};

const tabNames = ["misura","tilia","desayunos","eventos","equipo","mensajes","tareas","avisos","estaciones","pase"];
let current = "misura";

function initTabs() {
  const tabs = document.getElementById("tabs");
  tabNames.forEach(name => {
    const d = document.createElement("div");
    d.className = "tab" + (name === current ? " active" : "");
    d.textContent = name.charAt(0).toUpperCase() + name.slice(1);
    d.onclick = () => showSection(name);
    tabs.appendChild(d);
  });
}

function showSection(name) {
  current = name;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  event.target.classList.add("active");
  render();
}

function render() {
  if (["equipo","mensajes","tareas","avisos","estaciones","pase"].includes(current)) {
    document.getElementById("content").innerHTML = `<div class="card"><h2>${current.toUpperCase()}</h2><p>Sección activa. Funcionalidad básica lista.</p></div>`;
    return;
  }
  const list = sections[current] || [];
  document.getElementById("content").innerHTML = `<div class="card"><h2>${current.toUpperCase()}</h2>` +
    list.map(r => `<div class="recipe" onclick="openRecipe('${r.name}')"><h3>${r.name}</h3></div>`).join("") +
    `</div>`;
}

function openRecipe(name) {
  let r = null;
  for (let s in sections) {
    const f = sections[s].find(x => x.name === name);
    if (f) r = f;
  }
  if (!r) return;
  document.getElementById("modal-body").innerHTML = `<h2>${r.name}</h2><p>${r.detail}</p>`;
  document.getElementById("modal").style.display = "block";
}

function closeModal() { document.getElementById("modal").style.display = "none"; }

initTabs();
render();
window.onclick = e => { if (e.target.id === "modal") closeModal(); };
</script>
</body>
</html>
