<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cocina Hotel Arima</title>
<style>
:root { --bg:#0a0a0a; --card:#161616; --accent:#00f2ea; --text:#f5f5f5; --border:#2a2a2a; --muted:#888; }
* { box-sizing:border-box; }
body { font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); margin:0; padding:16px; max-width:920px; margin:0 auto; line-height:1.4; }
header { text-align:center; padding:24px 16px; background:#111; border-radius:18px; margin-bottom:20px; }
h1 { margin:0; font-size:1.7em; }
.subtitle { color:var(--muted); margin:6px 0 0; font-size:0.95em; }
.tabs { display:flex; gap:8px; flex-wrap:wrap; margin:16px 0 20px; }
.tab { padding:8px 16px; background:#222; border-radius:24px; cursor:pointer; font-size:14px; }
.tab.active { background:var(--accent); color:#000; font-weight:600; }
.card { background:var(--card); border-radius:16px; padding:16px; margin-bottom:14px; border:1px solid var(--border); }
.recipe { background:#1e1e1e; border-radius:12px; padding:14px; margin:8px 0; cursor:pointer; }
.recipe h3 { margin:0 0 4px; color:var(--accent); font-size:1.02em; }
.modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:1000; overflow:auto; }
.modal-content { background:#161616; margin:16px auto; padding:20px; border-radius:16px; max-width:680px; }
.close { float:right; font-size:26px; cursor:pointer; color:#aaa; }
.critical { color:#ff6b6b; font-weight:600; margin-top:8px; }
button { background:var(--accent); color:#000; border:none; padding:8px 14px; border-radius:8px; font-weight:600; cursor:pointer; margin:4px; }
input[type=file] { display:none; }
</style>
</head>
<body>
<header>
  <h1>Cocina Hotel Arima</h1>
  <div class="subtitle">Misura · Tilia · Desayunos · Eventos</div>
</header>

<div class="tabs">
  <div class="tab active" onclick="showSection('misura')">Misura</div>
  <div class="tab" onclick="showSection('tilia')">Tilia</div>
  <div class="tab" onclick="showSection('desayunos')">Desayunos</div>
  <div class="tab" onclick="showSection('eventos')">Eventos</div>
  <div class="tab" onclick="showSection('equipo')">Equipo</div>
  <div class="tab" onclick="showSection('mensajes')">Mensajes</div>
  <div class="tab" onclick="showSection('tareas')">Tareas</div>
  <div class="tab" onclick="showSection('avisos')">Avisos</div>
  <div class="tab" onclick="showSection('estaciones')">Estaciones</div>
  <div class="tab" onclick="showSection('pase')">Pase</div>
</div>

<div style="margin-bottom:16px;">
  <button onclick="exportRecipes()">Descargar recetas</button>
  <button onclick="document.getElementById('fileInput').click()">Subir recetas</button>
  <input type="file" id="fileInput" accept=".json" onchange="importRecipes(this)">
</div>

<div id="content"></div>

<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const sections = {
  misura: [
    {name: "Jamón ibérico Arturo Sánchez", detail: "Templar 45-60 min a 20-22°C. Lonchas en una sola capa.", critical: "Si está frío, la grasa no funde."},
    {name: "Croqueta cremosa de bacalao con pil-pil", detail: "Masa 25-28g. Fritura 175°C. Pil-pil de ajo asado.", critical: "No hervir el pil-pil."},
    {name: "Foie mi-cuit, compota de manzana reineta", detail: "Curado 12-18h. Centro 52-54°C.", critical: "Por encima de 56°C se funde."},
    {name: "Crema de castañas, cuajada de oveja y tartar de setas", detail: "Crema tibia, cuajada fría, tartar al momento.", critical: "Tartar se sala al final."},
    {name: "Romanesco a la brasa en salsa verde y yema curada", detail: "Marcado a brasa. Salsa verde. Yema curada.", critical: "Secar bien el romanesco."},
    {name: "Alcachofas estofadas con relleno de ibérico", detail: "Alcachofas + relleno de ibérico.", critical: "Control de cocción."},
    {name: "Arroz caldoso de níscalos y trufa", detail: "Arroz Molí de Rafalet. Níscalos y trufa.", critical: "Caldo limpio."},
    {name: "Sopa de pescado a la donostiarra", detail: "Sopa clásica donostiarra.", critical: "Fumet corto."},
    {name: "Rape con su refrito de ajos y txakoli", detail: "Rape + refrito de ajos + txakoli.", critical: "No sobrecocinar el rape."},
    {name: "Pulpo a la brasa, calabaza y mayonesa de aceitunas", detail: "Pulpo a la brasa. Calabaza asada.", critical: "Punto del pulpo."},
    {name: "Canelón de txangurro", detail: "Relleno de txangurro. Bechamel de mariscos.", critical: "Ligazón correcta."},
    {name: "Rodaballo salvaje a la brasa con escabeche de setas", detail: "Rodaballo salvaje. Escabeche de setas.", critical: "Producto salvaje."},
    {name: "Steak tartar de vaca con tuétano", detail: "Tartar + tuétano a la brasa.", critical: "Temperatura y higiene."},
    {name: "Presa ibérica glaseada", detail: "Presa Arturo Sánchez. Cebolleta asada.", critical: "Glaseado controlado."},
    {name: "Cordero lechal a la brasa con Idiazábal", detail: "Cordero lechal. Salsa de Idiazábal.", critical: "Punto de brasa."},
    {name: "Pichón de Bresse con mole y salsifí", detail: "Pichón. Salsa mole. Crema de salsifí.", critical: "Cocción precisa."},
    {name: "Chuletón a la brasa con sarmiento", detail: "Chuletón madurado. Sarmiento al final.", critical: "Sarmiento 1-2 min."},
    {name: "Patata frita con sal de hierbas", detail: "Doble fritura. Sal de hierbas y limón.", critical: "Crujiente inmediato."},
    {name: "Pimiento de piquillo y su pil-pil", detail: "Piquillos asados. Pil-pil de su jugo.", critical: "Emulsión estable."},
    {name: "Endivias escabechadas con mandarina", detail: "Endivias + escabeche cítrico.", critical: "Equilibrio ácido-dulce."},
    {name: "Pan de coca de Fuengirola con tomate", detail: "Coca + tomate Roseta + AOVE.", critical: "Pan caliente."},
    {name: "Cítricos de invierno en texturas", detail: "Cítricos + helado de leche de oveja.", critical: "Frescura."},
    {name: "Pastel fluido de chocolate, café y sal ahumada", detail: "Coulant. Centro líquido.", critical: "Tiempo de horno."},
    {name: "Manzana confitada con intxaursaltsa", detail: "Manzana + intxaursaltsa + helado de sidra.", critical: "Textura de la manzana."},
    {name: "Tarta de queso ahumada", detail: "Tarta horneada ahumada. Helado de ron y pasas.", critical: "Cuajado correcto."}
  ],
  tilia: [
    {name: "Gilda Yurrita con pan de hierbas", detail: "20 ud. Anchoa, piparra, aceituna.", critical: "Escurrir bien."},
    {name: "Croqueta cremosa de cecina de León", detail: "50 ud. Masa 40g.", critical: "Interior cremoso."},
    {name: "Buñuelo de calamar en su tinta", detail: "40 ud. Calamar + tinta.", critical: "Calamar tierno."},
    {name: "Patatas bravas confitadas", detail: "Confitar + fritura. Brava y alioli.", critical: "Picante constante."},
    {name: "Rabas crujientes con piquillos", detail: "Calamar rebozado. Emulsión de piquillos.", critical: "Cobertura fina."},
    {name: "Trinxat de patata y col rizada", detail: "Patata + col. Acabado crujiente.", critical: "No quedar aguado."},
    {name: "Huevo roto con boniato y jamón", detail: "Huevo + boniato + jamón.", critical: "Servicio inmediato."},
    {name: "Crema de calabaza con setas y naranja", detail: "Crema + setas + naranja.", critical: "Equilibrio dulce-ácido."},
    {name: "Hamburguesa de vaca con setas y brie", detail: "Vaca + setas + brie.", critical: "70°C / 2 min."},
    {name: "Pescado del día con parmentier y salsa verde", detail: "Pescado + parmentier + salsa verde.", critical: "Punto del pescado."},
    {name: "Canelón de setas e Idiazabal", detail: "Setas + Idiazabal.", critical: "Ligazón."},
    {name: "Costilla de lechal con reducción de sidra", detail: "Costilla + reducción de sidra.", critical: "Glaseado."},
    {name: "Tubetti rigati con albóndigas de ternera", detail: "Pasta + albóndigas.", critical: "Cocción completa."},
    {name: "Arroz con leche de oveja y avellana", detail: "Arroz + leche de oveja + crumble.", critical: "Grano tierno."},
    {name: "Tarta de Idiazabal con helado de ron y pasas", detail: "Tarta ahumada + helado.", critical: "Cuajado."},
    {name: "Pera al vino con mascarpone y lima", detail: "Pera + mascarpone + lima.", critical: "Textura de la pera."},
    {name: "Torrija de pan hojaldrado con toffee", detail: "Torrija + toffee + helado.", critical: "Empapado correcto."}
  ]
};

let currentSection = 'misura';

function showSection(sec) {
  currentSection = sec;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  render();
}

function render() {
  const list = sections[currentSection] || [];
  document.getElementById('content').innerHTML = '<div class="card"><h2>' + currentSection.toUpperCase() + '</h2>' +
    list.map(r => `<div class="recipe" onclick="openRecipe('${r.name}')"><h3>${r.name}</h3></div>`).join('') +
    '</div>';
}

function openRecipe(name) {
  let detail = "Ficha en desarrollo.";
  let critical = "";
  for (let sec in sections) {
    const found = sections[sec].find(r => r.name === name);
    if (found) {
      detail = found.detail;
      critical = found.critical || "";
    }
  }
  document.getElementById('modal-body').innerHTML = `<h2>${name}</h2><p>${detail}</p>${critical ? `<p class="critical">Punto crítico: ${critical}</p>` : ''}`;
  document.getElementById('modal').style.display = 'block';
}

function closeModal() { document.getElementById('modal').style.display = 'none'; }

function exportRecipes() {
  const data = JSON.stringify(sections, null, 2);
  const blob = new Blob([data], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'recetas-arima.json';
  a.click();
}

function importRecipes(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      Object.assign(sections, data);
      alert('Recetas importadas correctamente');
      render();
    } catch(err) {
      alert('Error al importar el archivo');
    }
  };
  reader.readAsText(file);
}

render();
window.onclick = e => { if (e.target.id === 'modal') closeModal(); };
</script>
</body>
</html>
