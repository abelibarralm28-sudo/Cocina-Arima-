<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cocina Hotel Arima</title>
<style>
body { font-family: system-ui, sans-serif; background:#0a0a0a; color:#f5f5f5; margin:0; padding:16px; max-width:800px; margin:0 auto; }
header { text-align:center; padding:20px; background:#111; border-radius:16px; }
h1 { margin:0; }
.tabs { display:flex; gap:6px; flex-wrap:wrap; margin:16px 0; }
.tab { padding:8px 14px; background:#222; border-radius:20px; cursor:pointer; }
.tab.active { background:#00f2ea; color:#000; font-weight:bold; }
.card { background:#161616; border-radius:14px; padding:16px; margin:12px 0; }
.recipe { background:#1e1e1e; border-radius:10px; padding:12px; margin:8px 0; cursor:pointer; }
.recipe h3 { margin:0; color:#00f2ea; }
.modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:1000; overflow:auto; }
.modal-content { background:#161616; margin:16px auto; padding:20px; border-radius:14px; max-width:650px; }
.close { float:right; font-size:24px; cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1>Cocina Hotel Arima</h1>
  <p>Misura · Tilia · Desayunos · Eventos</p>
</header>

<div class="tabs" id="tabs"></div>
<div id="content"></div>

<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const sections = {
  misura: [
    {name: "Jamón ibérico Arturo Sánchez", detail: "Templar 45-60 min a 20-22°C. Lonchear fino."},
    {name: "Croqueta cremosa de bacalao con pil-pil", detail: "Fritura 175°C. Pil-pil de ajo asado."},
    {name: "Rodaballo salvaje a la brasa con escabeche de setas", detail: "Brasa. Escabeche de setas."},
    {name: "Presa ibérica glaseada", detail: "Glaseado. Cebolleta asada."},
    {name: "Chuletón a la brasa con sarmiento", detail: "Brasa + sarmiento al final."}
  ],
  tilia: [
    {name: "Gilda Yurrita con pan de hierbas", detail: "Anchoa, piparra, aceituna."},
    {name: "Croqueta cremosa de cecina de León", detail: "Fritura 175°C. Interior cremoso."},
    {name: "Hamburguesa de vaca con setas y brie", detail: "Vaca + setas + brie. 70°C."}
  ],
  desayunos: [
    {name: "Tarta tres leches con leche de coco", detail: "Bizcocho + baño de tres leches de coco."},
    {name: "Tarta de chocolate clásica", detail: "Base de galleta + ganache."}
  ],
  eventos: [
    {name: "Higos con mascarpone y helado de pistacho", detail: "Helado de pistacho + crema de mascarpone + higos."},
    {name: "Salsa mole oscuro", detail: "Mole de chiles, frutos secos y chocolate."}
  ]
};

const tabNames = ["misura","tilia","desayunos","eventos","equipo","mensajes","tareas","avisos","estaciones","pase"];
let current = "misura";

function init() {
  const tabs = document.getElementById("tabs");
  tabNames.forEach(name => {
    const d = document.createElement("div");
    d.className = "tab" + (name === current ? " active" : "");
    d.textContent = name.charAt(0).toUpperCase() + name.slice(1);
    d.onclick = () => show(name);
    tabs.appendChild(d);
  });
  render();
}

function show(name) {
  current = name;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  event.target.classList.add("active");
  render();
}

function render() {
  if (["equipo","mensajes","tareas","avisos","estaciones","pase"].includes(current)) {
    document.getElementById("content").innerHTML = `<div class="card"><h2>${current.toUpperCase()}</h2><p>Sección activa.</p></div>`;
    return;
  }
  const list = sections[current] || [];
  document.getElementById("content").innerHTML = `<div class="card"><h2>${current.toUpperCase()}</h2>` +
    list.map(r => `<div class="recipe" onclick="openRecipe('${r.name}')"><h3>${r.name}</h3></div>`).join("") +
    `</div>`;
}

function openRecipe(name) {
  let r = null;
  for (let s in sections) {
    const f = sections[s].find(x => x.name === name);
    if (f) r = f;
  }
  if (!r) return;
  document.getElementById("modal-body").innerHTML = `<h2>${r.name}</h2><p>${r.detail}</p>`;
  document.getElementById("modal").style.display = "block";
}

function closeModal() { document.getElementById("modal").style.display = "none"; }

init();
window.onclick = e => { if (e.target.id === "modal") closeModal(); };
</script>
</body>
</html>
